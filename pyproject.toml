[project]
name = "coldopen"
version = "0.1.0"
description = "Reading a player's skill from their opening moves, using RL checkpoints as the labelled training set"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "torch>=2.2",
    "pettingzoo[classic]>=1.24",
    "scikit-learn>=1.4",
]

[project.optional-dependencies]
# Pgx supplies the JAX-accelerated Othello and Backgammon ladders.
games = ["pgx>=2.0", "jax>=0.4"]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["coldopen"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: trains or evaluates a network; minutes, not seconds"]
